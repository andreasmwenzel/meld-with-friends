name: Bug
description: Something in Meld doesn't work as it should
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Screenshots welcome.
    validations:
      required: true
  - type: input
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari
  - type: input
    attributes:
      label: Table code (if it happened in a game)
